# .github/workflows/bing-UHD-cn.yml
name: bing-UHD-cn
on:
  schedule:
    # 每天 00:05 UTC 运行（北京时间 08:05）
    - cron: '5 0 * * *'
  # 支持手动触发
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run script
        run: python bing-UHD-cn.py

      - name: Generate README
        run: python bing-UHD-cn-README.py

      - name: Commit and push changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          YEAR=$(date +%Y)
          git add bing-UHD-cn-${YEAR}.md bing-JSON-cn-${YEAR}.json bing-UHD-cn-${YEAR}/ bing-320-cn-${YEAR}/ bing-JSON-cn-${YEAR}/ README.md bing-UHD-cn-README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update Bing UHD CN wallpapers [skip ci]"
          fi
          # 清理未提交的残留改动，保证 rebase 环境干净
          git reset --hard
          git clean -fd
          git pull --rebase origin main
          git push origin main
