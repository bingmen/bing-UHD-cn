# .github/workflows/hubee.yml
# GitHub 仓库自动推送 Gitee 仓库的工作流
# 适用不同用户名、不同仓库、仓库私有或开源
#
# 使用说明：在 GitHub 仓库 Settings → Secrets and variables → Actions 中添加
# - `GITEE_ORG`：可选，Gitee 组织名，优先于 GITEE_USERNAME
# - `GITEE_USERNAME`：可选，Gitee 用户名，仅当 GITEE_ORG 不存在时生效
# - `GITEE_TOKEN`：**必填**（HTTPS 模式使用），Gitee 私人令牌（需勾选 projects 权限）
# - `GITEE_REPO`：可选，Gitee 目标仓库名，默认与 GitHub 仓库同名，不存在则自动新建
# - `GITEE_PRIVATE`：可选，Gitee 仓库可见性私有/开源（true / false），组织默认与 GitHub 仓库一致，个人私有不可设置
# - `GIT_PROTOCOL`：可选，推送协议：https（默认）或 ssh
# - `PRIVATE_KEY`：可选（SSH 模式必填），Gitee 仓库的 SSH 部署私钥（Deploy Key，需勾选"启用推送"）
#
# 支持场景：
# - GitHub 组织 -> Gitee 组织
# - GitHub 组织 -> Gitee 个人
# - GitHub 个人 -> Gitee 个人
# - GitHub 个人 -> Gitee 组织
# - HTTPS / SSH 两种推送协议
#
name: hubee

on:
  push:
    branches: [main, master]
  schedule:
    # 每天 UTC 02:00（北京时间 10:00）自动同步
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync:
    name: Sync to Gitee
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve target variables
        id: vars
        run: |
          # ---------- 判断 GitHub 仓库类型 ----------
          GITHUB_OWNER_TYPE="${{ github.event.repository.owner.type }}"
          echo "GitHub 仓库所有者类型：${GITHUB_OWNER_TYPE}"

          # ---------- Gitee 组织名（可选） ----------
          GITEE_ORG="${{ secrets.GITEE_ORG }}"

          # ---------- Gitee 用户名 ----------
          GITEE_USERNAME="${{ secrets.GITEE_USERNAME }}"

          # ---------- 目标命名空间解析 ----------
          if [ -n "$GITEE_ORG" ]; then
            GITEE_NAMESPACE="$GITEE_ORG"
            GITEE_TARGET_TYPE="org"
          elif [ -n "$GITEE_USERNAME" ]; then
            GITEE_NAMESPACE="$GITEE_USERNAME"
            GITEE_TARGET_TYPE="user"
          else
            GITEE_NAMESPACE="${{ github.repository_owner }}"
            GITEE_TARGET_TYPE="user"
          fi

          # ---------- Gitee 仓库名 ----------
          GITEE_REPO="${{ secrets.GITEE_REPO }}"
          if [ -z "$GITEE_REPO" ]; then
            GITEE_REPO="${{ github.event.repository.name }}"
          fi

          # ---------- Gitee 仓库可见性 ----------
          if [ "$GITEE_TARGET_TYPE" = "user" ] && [ -z "$GITEE_ORG" ]; then
            GITEE_PRIVATE="true"
          else
            GITEE_PRIVATE="${{ secrets.GITEE_PRIVATE }}"
            if [ -z "$GITEE_PRIVATE" ]; then
              if [ "${{ github.event.repository.private }}" = "true" ]; then
                GITEE_PRIVATE="true"
              else
                GITEE_PRIVATE="false"
              fi
            fi
          fi

          GITEE_PRIVATE="$(echo "$GITEE_PRIVATE" | tr '[:upper:]' '[:lower:]')"
          case "$GITEE_PRIVATE" in
            true|1|yes)  GITEE_PRIVATE="true"  ;;
            false|0|no)  GITEE_PRIVATE="false" ;;
            *)
              echo "::warning::GITEE_PRIVATE='$GITEE_PRIVATE' 无法识别，回退为 true"
              GITEE_PRIVATE="true"
              ;;
          esac

          # ---------- 推送协议解析 ----------
          # 默认 https；可选 ssh
          GIT_PROTOCOL="${{ secrets.GIT_PROTOCOL }}"
          GIT_PROTOCOL="$(echo "$GIT_PROTOCOL" | tr '[:upper:]' '[:lower:]')"
          case "$GIT_PROTOCOL" in
            ssh)        GIT_PROTOCOL="ssh"   ;;
            https|"")   GIT_PROTOCOL="https" ;;
            *)
              echo "::warning::GIT_PROTOCOL='$GIT_PROTOCOL' 无法识别，回退为 https"
              GIT_PROTOCOL="https"
              ;;
          esac

          # 协议依赖校验
          if [ "$GIT_PROTOCOL" = "ssh" ]; then
            if [ -z "${{ secrets.PRIVATE_KEY }}" ]; then
              echo "::error::GIT_PROTOCOL=ssh 时必须配置 PRIVATE_KEY（Gitee 部署私钥）"
              exit 1
            fi
          else
            if [ -z "${{ secrets.GITEE_TOKEN }}" ]; then
              echo "::error::GIT_PROTOCOL=https 时必须配置 GITEE_TOKEN"
              exit 1
            fi
          fi

          echo "gitee_namespace=$GITEE_NAMESPACE"     >> "$GITHUB_OUTPUT"
          echo "gitee_target_type=$GITEE_TARGET_TYPE" >> "$GITHUB_OUTPUT"
          echo "gitee_repo=$GITEE_REPO"               >> "$GITHUB_OUTPUT"
          echo "gitee_private=$GITEE_PRIVATE"         >> "$GITHUB_OUTPUT"
          echo "github_owner_type=$GITHUB_OWNER_TYPE" >> "$GITHUB_OUTPUT"
          echo "git_protocol=$GIT_PROTOCOL"           >> "$GITHUB_OUTPUT"

          echo "::notice::GitHub(${GITHUB_OWNER_TYPE}) → Gitee(${GITEE_TARGET_TYPE}): ${GITEE_NAMESPACE}/${GITEE_REPO} (private=${GITEE_PRIVATE}, protocol=${GIT_PROTOCOL})"

      - name: Ensure Gitee repository exists
        # 仓库创建依赖 Gitee OpenAPI，必须使用 Token，与推送协议无关
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          GITEE_NAMESPACE="${{ steps.vars.outputs.gitee_namespace }}"
          GITEE_TARGET_TYPE="${{ steps.vars.outputs.gitee_target_type }}"
          GITEE_REPO="${{ steps.vars.outputs.gitee_repo }}"
          GITEE_PRIVATE="${{ steps.vars.outputs.gitee_private }}"

          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error::缺少 GITEE_TOKEN，无法调用 Gitee OpenAPI 创建仓库（SSH 推送也需要 Token 创建仓库）"
            exit 1
          fi

          API="https://gitee.com/api/v5"
          REPO_API="${API}/repos/${GITEE_NAMESPACE}/${GITEE_REPO}"

          HTTP_CODE=$(curl -s -o /tmp/repo.json -w "%{http_code}" \
            "${REPO_API}?access_token=${GITEE_TOKEN}")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "::notice::Gitee 仓库已存在：${GITEE_NAMESPACE}/${GITEE_REPO}"
          elif [ "$HTTP_CODE" = "404" ]; then
            echo "::notice::Gitee 仓库不存在，正在创建：${GITEE_NAMESPACE}/${GITEE_REPO}"

            if [ "$GITEE_TARGET_TYPE" = "org" ]; then
              CREATE_URL="${API}/orgs/${GITEE_NAMESPACE}/repos"
            else
              CREATE_URL="${API}/user/repos"
            fi

            CREATE_CODE=$(curl -s -o /tmp/create.json -w "%{http_code}" \
              -X POST "${CREATE_URL}" \
              -H "Content-Type: application/json" \
              -d "{
                \"access_token\": \"${GITEE_TOKEN}\",
                \"name\": \"${GITEE_REPO}\",
                \"private\": ${GITEE_PRIVATE},
                \"auto_init\": false,
                \"has_issues\": true,
                \"has_wiki\": false
              }")

            if [ "$CREATE_CODE" = "201" ] || [ "$CREATE_CODE" = "200" ]; then
              echo "::notice::Gitee 仓库创建成功"
            else
              echo "::error::创建 Gitee 仓库失败（HTTP ${CREATE_CODE}）"
              cat /tmp/create.json
              exit 1
            fi
          else
            echo "::error::查询 Gitee 仓库失败（HTTP ${HTTP_CODE}）"
            cat /tmp/repo.json
            exit 1
          fi

      - name: Setup SSH key
        if: ${{ steps.vars.outputs.git_protocol == 'ssh' }}
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # 写入私钥（保留原始换行，若 Secret 中换行被转义为 \n 会自动还原）
          printf '%s\n' "$PRIVATE_KEY" | sed 's/\\n/\n/g' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # 预置 gitee.com 主机指纹，避免首次连接交互
          ssh-keyscan -t rsa,ecdsa,ed25519 gitee.com >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

          # 校验私钥可用
          ssh -T -o StrictHostKeyChecking=yes git@gitee.com || true

          echo "::notice::SSH 密钥已配置"

      - name: Push to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          GITEE_NAMESPACE="${{ steps.vars.outputs.gitee_namespace }}"
          GITEE_REPO="${{ steps.vars.outputs.gitee_repo }}"
          GIT_PROTOCOL="${{ steps.vars.outputs.git_protocol }}"

          # 配置 Git 身份
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # ---------- 根据协议生成远端地址 ----------
          if [ "$GIT_PROTOCOL" = "ssh" ]; then
            # SSH：使用已配置的部署私钥
            REMOTE_URL="git@gitee.com:${GITEE_NAMESPACE}/${GITEE_REPO}.git"
            echo "::notice::推送协议：SSH"
          else
            # HTTPS：使用 oauth2 + 私人令牌（个人 / 组织仓库通用）
            REMOTE_URL="https://oauth2:${GITEE_TOKEN}@gitee.com/${GITEE_NAMESPACE}/${GITEE_REPO}.git"
            echo "::notice::推送协议：HTTPS"
          fi

          if git remote | grep -qx gitee; then
            git remote set-url gitee "$REMOTE_URL"
          else
            git remote add gitee "$REMOTE_URL"
          fi

          # 镜像推送所有分支与标签（强制覆盖，与 GitHub 保持一致）
          git push --prune --force gitee \
            "refs/remotes/origin/*:refs/heads/*" \
            "refs/tags/*:refs/tags/*"

          echo "::notice::已成功同步到 https://gitee.com/${GITEE_NAMESPACE}/${GITEE_REPO}"
